spring:
    application:
        name: spring-database
    datasource:
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://localhost:3306/spring-database?createDatabaseIfNotExist=true&useTimeZone=true&serverTimeZone=UTC
        username: root
        password: admin123
    jpa:
        defer-datasource-initialization: true
        hibernate:
            ddl-auto: none # update # will not be more hibernate that will create the table, but via migration
        properties:
            hibernate:
                dialect: org.hibernate.dialect.MySQLDialect
        show-sql: false
    flyway:
        locations: classpath:db/migration
        enabled: true

logging:
    level:
        '[com.seijihe.rest_with_spring_boot]': INFO
        root: WARN
    file:
        name: logs/app.log
